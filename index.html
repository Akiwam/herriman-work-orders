<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Center</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-kicker">Command Center</span>
        <span class="brand-name" id="project-name">Loading…</span>
      </div>
      <div class="topbar-status">
        <div id="stamp" class="stamp" aria-live="polite">Loading data…</div>
        <div id="mode-switch" class="mode-switch" role="group" aria-label="Data mode"></div>
      </div>
    </div>
    <div id="sample-ribbon" class="sample-ribbon" hidden>
      SAMPLE DATA — made-up numbers to show the layout. Not your project. Switch to <strong>Real</strong> before you demo.
    </div>
    <nav id="tabs" class="tabs" aria-label="Command Center tabs"></nav>
  </header>

  <main id="view" class="view">
    <p class="muted">Loading…</p>
  </main>

  <noscript><p class="view">This page needs JavaScript to read the project files in <code>.colaberry/</code>.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
